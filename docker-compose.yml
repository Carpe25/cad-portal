# CAD Portal — Docker Compose
#
# Postgres is published on 127.0.0.1:5434 (5433 is used by medusa-postgres on the server).
# App is published on 127.0.0.1:3001 (point Cloudflare Tunnel here if needed).
#
# Setup:
#   1. Copy .env.example to .env and set POSTGRES_PASSWORD, SESSION_SECRET, etc.
#   2. docker compose up postgres -d
#   3. ./scripts/neon-migrate.sh     # one-time Neon → local copy
#   4. docker compose up -d
#
# Local dev (without app container):
#   docker compose up postgres -d
#   DATABASE_URL=postgresql://carpediam:YOUR_PASSWORD@localhost:5434/cad_portal npm run dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: cad-portal-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carpediam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cad_portal}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      RETENTION_DAYS: "14"
    volumes:
      - postgres-backups:/backups
      - ./scripts/pg-backup.sh:/pg-backup.sh:ro
    entrypoint: ["sh", "/pg-backup.sh"]

  cad-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: cad-portal:latest
    container_name: cad-portal-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-carpediam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cad_portal}
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:3000/login",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres-data:
  postgres-backups:
